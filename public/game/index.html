<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Manor Hunt — UI Prototype</title>
<meta name="viewport" content="width=1920">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=IM+Fell+English:ital@0;1&family=Share+Tech+Mono&family=Spectral:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A0F0A;
    --bg-2:#0d0805;
    --card:#2C1F14;
    --card-edge:#5a4128;
    --ink:#E8D9C0;
    --ink-dim:#9A8B76;
    --sanity:#7B6FCC;
    --hydration:#4AADCC;
    --fear:#CC5A3A;
    --bleed:#AA2020;
    --seal:#4A8C4A;
    --danger:#CC3A1A;
    --pov-rookie:#2A3D5C;
    --pov-huntress:#2D1F45;
    --pov-ace:#3D2A0F;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#000;color:var(--ink);
    font-family:'IM Fell English','Spectral','Noto Serif TC',serif;
    -webkit-font-smoothing:antialiased;height:100%;overflow:hidden;}

  /* ── Stage scaling 1920x1080 ───────────────────────────── */
  .stage-host{position:fixed;inset:0;display:grid;place-items:center;background:#000;}
  .stage{position:relative;width:1920px;height:1080px;transform-origin:center center;
    background:radial-gradient(ellipse at 50% 35%, #2a1a10 0%, var(--bg) 38%, var(--bg-2) 100%);
    overflow:hidden;}

  /* ── Background layers ─────────────────────────────────── */
  .bg-stars{position:absolute;inset:0;background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(232,217,192,.55), transparent 60%),
    radial-gradient(1px 1px at 22% 9%, rgba(232,217,192,.4), transparent 60%),
    radial-gradient(1px 1px at 34% 24%, rgba(232,217,192,.5), transparent 60%),
    radial-gradient(1px 1px at 47% 6%, rgba(232,217,192,.6), transparent 60%),
    radial-gradient(1.5px 1.5px at 58% 14%, rgba(232,217,192,.7), transparent 60%),
    radial-gradient(1px 1px at 71% 22%, rgba(232,217,192,.4), transparent 60%),
    radial-gradient(1px 1px at 82% 11%, rgba(232,217,192,.5), transparent 60%),
    radial-gradient(1px 1px at 91% 19%, rgba(232,217,192,.45), transparent 60%);
    opacity:.7; pointer-events:none;}

  .bg-vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(0,0,0,.55) 78%, #000 100%);}

  .bg-silhouette{position:absolute;inset:0;pointer-events:none;}

  /* ── Region backgrounds + per-encounter variants ─────────── */
  .bg-region{position:absolute;inset:0;pointer-events:none;}
  .bg-region .bg-base{position:absolute;inset:0;}
  .bg-region .bg-variant{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.55;}

  /* AREA I — courtyard: cold blue-grey, iron + flagstone */
  .region-courtyard .bg-base{
    background:
      radial-gradient(ellipse at 50% 20%, rgba(60,80,110,.35), transparent 55%),
      radial-gradient(ellipse at 50% 90%, rgba(0,0,0,.6), transparent 60%),
      linear-gradient(180deg,#0a1018 0%, #1a1410 60%, #0a0604 100%);
  }
  .region-courtyard.variant-0 .bg-variant{
    background:repeating-linear-gradient(90deg, transparent 0 80px, rgba(160,180,200,.04) 80px 81px);}
  .region-courtyard.variant-1 .bg-variant{
    background:radial-gradient(circle at 30% 70%, rgba(150,170,200,.08), transparent 40%);}
  .region-courtyard.variant-2 .bg-variant{
    background:radial-gradient(circle at 75% 60%, rgba(200,180,140,.06), transparent 35%);}

  /* AREA II — catacombs: damp earth + sarcophagus stone */
  .region-catacombs .bg-base{
    background:
      radial-gradient(ellipse at 50% 30%, rgba(50,30,18,.45), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.7), transparent 55%),
      linear-gradient(180deg,#1a0a04 0%, #0a0604 100%);
  }
  .region-catacombs.variant-0 .bg-variant{
    background:repeating-linear-gradient(0deg, transparent 0 90px, rgba(60,30,18,.08) 90px 92px);}
  .region-catacombs.variant-1 .bg-variant{
    background:radial-gradient(circle at 25% 65%, rgba(120,60,30,.1), transparent 30%);}
  .region-catacombs.variant-2 .bg-variant{
    background:radial-gradient(circle at 80% 75%, rgba(70,40,20,.12), transparent 35%);}

  /* AREA III — forest: bluish moonlight + earth */
  .region-forest .bg-base{
    background:
      radial-gradient(ellipse at 50% 15%, rgba(80,100,140,.4), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.7), transparent 60%),
      linear-gradient(180deg,#0a1418 0%, #0a0a08 60%, #060604 100%);
  }
  .region-forest.variant-0 .bg-variant{
    background:radial-gradient(circle at 20% 50%, rgba(150,200,180,.06), transparent 40%);}
  .region-forest.variant-1 .bg-variant{
    background:radial-gradient(circle at 75% 45%, rgba(180,200,220,.06), transparent 35%);}
  .region-forest.variant-2 .bg-variant{
    background:repeating-linear-gradient(170deg, transparent 0 60px, rgba(80,120,100,.04) 60px 62px);}

  /* AREA IV — hall: warm dust + lantern */
  .region-hall .bg-base{
    background:
      radial-gradient(ellipse at 50% 25%, rgba(120,80,40,.4), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.7), transparent 60%),
      linear-gradient(180deg,#1a1208 0%, #0e0804 100%);
  }
  .region-hall.variant-0 .bg-variant{
    background:radial-gradient(circle at 50% 30%, rgba(220,160,80,.1), transparent 40%);}
  .region-hall.variant-1 .bg-variant{
    background:repeating-linear-gradient(90deg, transparent 0 220px, rgba(240,200,140,.05) 220px 222px);}
  .region-hall.variant-2 .bg-variant{
    background:radial-gradient(circle at 80% 20%, rgba(200,140,80,.09), transparent 35%);}

  /* AREA V — sanctum: blood-rust + low light */
  .region-sanctum .bg-base{
    background:
      radial-gradient(ellipse at 50% 70%, rgba(80,10,10,.45), transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.8), transparent 55%),
      linear-gradient(180deg,#1a0408 0%, #0a0204 100%);
  }
  .region-sanctum.variant-0 .bg-variant{
    background:radial-gradient(circle at 50% 70%, rgba(180,40,40,.12), transparent 35%);}
  .region-sanctum.variant-1 .bg-variant{
    background:radial-gradient(circle at 30% 60%, rgba(140,30,40,.1), transparent 35%);}
  .region-sanctum.variant-2 .bg-variant{
    background:radial-gradient(circle at 70% 75%, rgba(160,30,40,.1), transparent 30%);}

  /* fog */
  .fog{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.18;}
  .fog svg{width:100%;height:100%}
  @keyframes fogA{from{transform:translateX(-15%)}to{transform:translateX(15%)}}
  @keyframes fogB{from{transform:translateX(10%)}to{transform:translateX(-10%)}}
  .fog-a{animation:fogA 90s linear infinite alternate}
  .fog-b{animation:fogB 130s linear infinite alternate;opacity:.55;}

  /* candlelight */
  .candle{position:absolute;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,184,90,.18), rgba(255,140,40,.07) 40%, transparent 70%);
    pointer-events:none;mix-blend-mode:screen;
    animation:flicker 2.4s ease-in-out infinite;}
  @keyframes flicker{
    0%,100%{opacity:.85;transform:scale(1)}
    20%{opacity:1;transform:scale(1.03)}
    35%{opacity:.7;transform:scale(.98)}
    55%{opacity:.95;transform:scale(1.02)}
    78%{opacity:.6;transform:scale(.96)}
  }

  /* ── HUD : Top-left POV ────────────────────────────────── */
  .pov{position:absolute;left:36px;top:32px;max-width:380px;}
  .pov .label{font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:.18em;
    color:var(--ink-dim);text-transform:uppercase;}
  .pov .name{font-family:'Cinzel',serif;font-weight:700;font-size:34px;line-height:1.1;
    color:var(--ink);margin-top:4px;letter-spacing:.04em;}
  .pov .name .arrow{color:var(--ink-dim);margin-right:8px;font-weight:500;}
  .pov .zone{margin-top:14px;font-family:'Share Tech Mono',monospace;font-size:14px;
    color:var(--ink);letter-spacing:.06em;}
  .pov .zone .num{color:var(--ink-dim);}
  .pov .traits{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}
  .pov .trait{font-family:'IM Fell English',serif;font-size:13px;color:var(--ink-dim);
    border:1px solid rgba(154,139,118,.35);padding:3px 10px;border-radius:2px;
    background:rgba(232,217,192,.03);}
  .pov .trait::before{content:"✦";color:#b8975a;margin-right:6px;font-size:11px;}
  .pov .deceased{margin-top:10px;font-family:'Cinzel',serif;font-size:14px;letter-spacing:.1em;
    color:#7a5a4a;text-decoration:line-through;text-decoration-color:rgba(170,32,32,.7);}

  /* ── HUD : Top-right Boss seal ─────────────────────────── */
  .seals{position:absolute;right:36px;top:32px;width:300px;text-align:right;}
  .seals .head{font-family:'Cinzel',serif;font-size:14px;letter-spacing:.22em;
    color:var(--ink-dim);text-transform:uppercase;margin-bottom:14px;}
  .seal-row{display:flex;align-items:center;justify-content:flex-end;gap:12px;
    margin-bottom:10px;font-family:'IM Fell English',serif;font-size:18px;}
  .seal-row .name{color:var(--ink);}
  .seal-row.locked .name{color:#6a8a6a;}
  .seal-row.unlocked .name{color:var(--ink-dim);}
  .seal-row .icn{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid rgba(154,139,118,.35);border-radius:3px;font-size:13px;}
  .seal-row.locked .icn{color:var(--seal);border-color:rgba(74,140,74,.5);
    background:rgba(74,140,74,.08);}
  .seal-row.unlocked .icn{color:var(--ink-dim);}
  .seal-row .meta{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.1em;
    color:var(--ink-dim);text-transform:uppercase;}

  /* ── Top center : Stat bars ────────────────────────────── */
  .stats{position:absolute;left:50%;top:40px;transform:translateX(-50%);
    display:grid;grid-template-columns:repeat(4, 200px);gap:32px;
    background:rgba(20,12,8,.55);backdrop-filter:blur(2px);
    padding:18px 32px;border:1px solid rgba(154,139,118,.18);
    border-top:none;border-radius:0 0 4px 4px;}
  .stat{display:flex;flex-direction:column;gap:6px;}
  .stat .row1{display:flex;justify-content:space-between;align-items:baseline;
    font-family:'Cinzel',serif;font-size:13px;letter-spacing:.18em;text-transform:uppercase;}
  .stat .row1 .nm{color:var(--ink);}
  .stat .row1 .vl{font-family:'Cinzel',serif;font-size:18px;letter-spacing:.06em;
    font-weight:700;color:var(--ink-dim);opacity:0;transition:opacity .12s;
    min-width:36px;text-align:right;}
  .stat .row1 .vl.show{opacity:1;}
  .stat .row1 .vl.bad{color:#e08a6a;text-shadow:0 0 10px rgba(204,58,26,.55);}
  .stat .row1 .vl.good{color:#aacf9c;text-shadow:0 0 10px rgba(74,140,74,.45);}
  .stat .bar{height:8px;background:rgba(0,0,0,.55);border:1px solid rgba(154,139,118,.25);
    position:relative;overflow:hidden;}
  .stat .fill{position:absolute;inset:0;width:50%;transition:width .4s ease,
    background-color .25s ease;}
  .stat.danger .bar{animation:pulse 1.1s ease-in-out infinite;border-color:var(--danger);}
  .stat.danger .row1 .nm{color:var(--danger) !important;}
  .stat.warn .bar{border-color:#cc9a3a;box-shadow:0 0 0 1px rgba(204,154,58,.35) inset;}
  .stat.warn .row1 .nm{color:#cc9a3a !important;}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(204,58,26,.0);}
    50%{box-shadow:0 0 0 3px rgba(204,58,26,.45);}
  }
  .stat.locked .bar{background:repeating-linear-gradient(45deg,
    rgba(154,139,118,.08) 0 6px, rgba(0,0,0,.25) 6px 12px);}
  .stat.locked .fill{display:none;}
  .stat.locked .row1 .vl::before{content:"🔒 ";font-size:10px;}

  /* (delta numerals removed — replaced by arrow indic in row1) */

  /* ── Center card ──────────────────────────────────────── */
  .card-wrap{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);
    width:520px;height:720px;perspective:1200px;}
  .card{position:absolute;inset:0;cursor:grab;
    background:linear-gradient(180deg,#352618 0%, var(--card) 50%, #1a1108 100%);
    border:2px solid var(--card-edge);
    box-shadow:
      0 0 0 1px rgba(0,0,0,.6),
      0 30px 80px rgba(0,0,0,.7),
      0 0 60px rgba(255,180,90,.06) inset;
    transform:rotate(-1.5deg);
    transition:box-shadow .25s;
    user-select:none;
    display:flex;flex-direction:column;}
  .card.dragging{cursor:grabbing;transition:none;}
  .card::before{
    content:"";position:absolute;inset:6px;pointer-events:none;
    border:1px solid rgba(232,217,192,.18);
    background:
      radial-gradient(ellipse at 30% 20%, rgba(232,217,192,.05), transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(0,0,0,.35), transparent 60%);
  }
  /* corner ornaments */
  .card .corner{position:absolute;width:42px;height:42px;pointer-events:none;
    color:#b8975a;opacity:.85;}
  .card .corner.tl{top:8px;left:8px;}
  .card .corner.tr{top:8px;right:8px;transform:scaleX(-1);}
  .card .corner.bl{bottom:8px;left:8px;transform:scaleY(-1);}
  .card .corner.br{bottom:8px;right:8px;transform:scale(-1,-1);}

  .card .body-text{padding:48px 44px 18px;font-family:'IM Fell English',serif;
    font-size:22px;line-height:1.45;color:var(--ink);text-align:center;
    text-wrap:pretty; letter-spacing:.01em;
    text-shadow:0 1px 0 rgba(0,0,0,.5);}
  .card .body-text::first-letter{font-family:'Cinzel',serif;font-size:30px;color:#d8b87c;}

  .portrait{margin:8px 36px 16px;height:380px;position:relative;
    background:var(--pov-rookie);
    border:1px solid rgba(0,0,0,.4);
    box-shadow:0 0 0 4px rgba(232,217,192,.08), 0 10px 30px rgba(0,0,0,.6) inset;
    overflow:hidden;}
  .portrait .grime{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 110%, rgba(0,0,0,.5), transparent 60%),
      radial-gradient(ellipse at 50% -10%, rgba(255,255,255,.06), transparent 50%);
    mix-blend-mode:multiply;}
  .portrait svg{display:block;width:100%;height:100%;}

  .card .name{font-family:'Cinzel',serif;font-weight:700;font-size:24px;
    text-align:center;color:var(--ink);letter-spacing:.14em;
    text-transform:uppercase;margin-top:auto;padding:0 24px;}
  .card .role{font-family:'IM Fell English',serif;font-style:italic;font-size:14px;
    text-align:center;color:var(--ink-dim);margin-top:4px;
    letter-spacing:.08em;padding-bottom:22px;}
  .card.boss .name{font-size:30px;color:#f3d29a;
    text-shadow:0 0 12px rgba(204,58,26,.55), 0 0 24px rgba(204,58,26,.3);}
  .card.final{border-color:#aa1a14;box-shadow:
      0 0 0 1px rgba(0,0,0,.6),
      0 30px 80px rgba(0,0,0,.7),
      0 0 60px rgba(170,26,20,.35) inset;}
  .card.final .name{color:#ffd0a8;
    text-shadow:0 0 14px rgba(204,32,32,.7), 0 0 28px rgba(204,32,32,.4);}

  /* drag affordance */
  .swipe-hint{position:absolute;top:50%;transform:translateY(-50%);
    font-family:'Cinzel',serif;font-size:12px;letter-spacing:.3em;
    color:var(--ink-dim);text-transform:uppercase;opacity:.5;pointer-events:none;}
  .swipe-hint.left{left:-110px;}
  .swipe-hint.right{right:-110px;}

  /* choice labels overlaid on card while dragging */
  .choice-banner{position:absolute;top:30px;font-family:'Cinzel',serif;
    font-size:34px;letter-spacing:.2em;font-weight:700;
    padding:8px 16px;border:2px solid currentColor;
    transform:rotate(-12deg);opacity:0;transition:opacity .12s;
    background:rgba(28,15,10,.55);}
  .choice-banner.left{left:32px;color:#cf8c5a;}
  .choice-banner.right{right:32px;color:#9bb38b;transform:rotate(12deg);}
  .choice-banner.show{opacity:1;}

  /* ── Bottom-left : character roster ───────────────────── */
  .roster{position:absolute;left:36px;bottom:32px;display:flex;gap:18px;}
  .ros{display:flex;flex-direction:column;align-items:flex-start;gap:4px;
    padding:10px 14px;border:1px solid rgba(154,139,118,.2);min-width:120px;
    background:rgba(20,12,8,.4);}
  .ros.active{border-color:#b8975a;box-shadow:0 0 0 1px #b8975a, 0 0 24px rgba(184,151,90,.18);
    background:rgba(40,26,12,.5);}
  .ros.dead{opacity:.55;}
  .ros .nm{font-family:'Cinzel',serif;font-size:14px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink);}
  .ros.dead .nm{text-decoration:line-through;text-decoration-color:rgba(170,32,32,.7);
    color:var(--ink-dim);}
  .ros .nm::before{display:inline-block;width:14px;}
  .ros.dead .nm::before{content:"† ";color:#aa2020;}
  .ros.active .nm::before{content:"▸ ";color:#b8975a;}
  .ros .st{font-family:'Share Tech Mono',monospace;font-size:11px;
    letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase;}
  .ros .reset-btn{margin-top:6px;padding:4px 8px;font-size:10px;
    font-family:'Cinzel',serif;letter-spacing:.16em;text-transform:uppercase;
    background:transparent;color:#c8b890;border:1px solid rgba(184,151,90,.5);
    cursor:pointer;transition:all .2s;}
  .ros .reset-btn:hover:not(:disabled){background:rgba(184,151,90,.18);
    box-shadow:0 0 12px rgba(184,151,90,.3);color:#f0d8a0;}
  .ros .reset-btn:disabled{opacity:.4;cursor:default;color:#7a6a55;}

  /* ── Bottom center : artifacts ───────────────────────── */
  .artifacts{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);
    display:grid;grid-template-columns:repeat(3,220px);gap:14px;}
  .artifact{padding:10px 14px;border:1px solid rgba(154,139,118,.25);
    background:rgba(20,12,8,.55);display:flex;align-items:center;gap:10px;}
  .artifact .glyph{width:34px;height:34px;display:grid;place-items:center;
    border:1px solid rgba(184,151,90,.4);color:#d8b87c;font-size:18px;
    font-family:'Cinzel',serif;background:rgba(0,0,0,.35);}
  .artifact .meta{display:flex;flex-direction:column;line-height:1.2;}
  .artifact .meta .lb{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.16em;
    color:var(--ink);text-transform:uppercase;}
  .artifact .meta .vl{font-family:'IM Fell English',serif;font-style:italic;
    font-size:13px;color:var(--ink-dim);}
  .artifact.consumed{opacity:.4;}
  .artifact.consumed .glyph{color:var(--ink-dim);}
  .artifact.held .glyph{color:#e9c989;background:rgba(184,151,90,.12);}

  /* ── Bottom-right : quest list ───────────────────────── */
  .quests{position:absolute;right:36px;bottom:32px;width:300px;}
  .quests .head{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.22em;
    color:var(--ink-dim);text-transform:uppercase;margin-bottom:12px;text-align:right;}
  .qrow{display:flex;align-items:center;justify-content:flex-end;gap:10px;
    font-family:'IM Fell English',serif;font-size:18px;color:var(--ink);
    margin-bottom:8px;}
  .qrow.hidden{font-style:italic;color:var(--ink-dim);}
  .qrow .box{width:18px;height:18px;border:1px solid rgba(154,139,118,.5);
    display:inline-grid;place-items:center;font-size:13px;color:#aacf9c;}
  .qrow.done{color:var(--ink-dim);text-decoration:line-through;
    text-decoration-color:rgba(154,139,118,.6);}
  .qrow.done .box{background:rgba(74,140,74,.18);border-color:rgba(74,140,74,.7);}

  /* card transition states */
  .card.flying-left{transition:transform .55s cubic-bezier(.5,0,.5,1), opacity .55s;
    transform:translateX(-1400px) rotate(-22deg);opacity:0;}
  .card.flying-right{transition:transform .55s cubic-bezier(.5,0,.5,1), opacity .55s;
    transform:translateX(1400px) rotate(22deg);opacity:0;}
  .card.entering{animation:enter .55s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes enter{
    from{transform:translateY(60px) rotate(-6deg);opacity:0;filter:blur(6px);}
    to{transform:rotate(-1.5deg);opacity:1;filter:blur(0);}
  }

  /* ── Death overlay ─────────────────────────────────────── */
  .death-overlay{position:absolute;inset:0;z-index:50;
    background:radial-gradient(ellipse at center, rgba(40,8,8,.82) 0%, rgba(0,0,0,.96) 75%);
    display:grid;place-items:center;animation:dfade 1.1s ease both;}
  @keyframes dfade{from{opacity:0}to{opacity:1}}
  .death-card{width:560px;padding:34px 42px;text-align:center;
    background:linear-gradient(180deg,#2a0808 0%, #1a0404 100%);
    border:2px solid #5a1818;
    box-shadow:0 0 60px rgba(170,32,32,.45),0 30px 80px rgba(0,0,0,.7);
    animation:dpop .9s cubic-bezier(.2,.7,.3,1) both;animation-delay:.2s;
    position:relative;}
  @keyframes dpop{from{transform:translateY(40px) scale(.94);opacity:0;filter:blur(8px)}
    to{transform:none;opacity:1;filter:blur(0)}}
  .death-banner{font-family:'Cinzel',serif;font-size:22px;letter-spacing:.4em;
    color:#cc3a1a;margin-bottom:20px;text-transform:uppercase;}
  .death-portrait{width:280px;height:280px;margin:0 auto 22px;
    border:1px solid #3a1010;background:#0a0404;
    filter:grayscale(.55) brightness(.6) sepia(.25) hue-rotate(330deg);}
  .death-name{font-family:'Cinzel',serif;font-size:28px;color:#e8d9c0;
    letter-spacing:.18em;margin-bottom:6px;text-transform:uppercase;}
  .death-name::before{content:"† ";color:#aa2020;}
  .death-stat{font-family:'IM Fell English',serif;font-style:italic;font-size:14px;
    color:#9a8b76;letter-spacing:.12em;margin-bottom:18px;}
  .death-cause{font-family:'IM Fell English',serif;font-size:20px;color:#d8c8b8;
    line-height:1.55;margin-bottom:18px;text-wrap:pretty;}
  .death-relic{margin:0 -8px 26px;padding:14px 18px;

  .death-continue{font-family:'Cinzel',serif;font-size:14px;letter-spacing:.32em;

  .death-continue:hover{background:rgba(170,32,32,.18);border-color:#cc3a1a;
    box-shadow:0 0 20px rgba(204,58,26,.3);}
  .death-continue.final{border-color:#3a3028;font-style:italic;color:#9a8b76;}

  /* ── Ending overlay ───────────────────────────────── */
  .death-overlay.ending.good{
    background:radial-gradient(ellipse at center, rgba(40,30,18,.86) 0%, rgba(0,0,0,.97) 80%);}
  .death-overlay.ending.bad{
    background:radial-gradient(ellipse at center, rgba(20,8,8,.94) 0%, rgba(0,0,0,1) 80%);}
  .ending-card{width:620px !important;}
  .ending-card.good{background:linear-gradient(180deg,#2a1f10 0%, #1a1208 100%) !important;
    border-color:#7a5a28 !important;
    box-shadow:0 0 80px rgba(220,180,90,.25),0 30px 80px rgba(0,0,0,.8) !important;}
  .ending-card.bad{background:linear-gradient(180deg,#1a0a0a 0%, #0a0404 100%) !important;

    text-shadow:0 0 24px rgba(170,32,32,.5);}

  /* hint shimmer for low stat */
  .alert-strip{position:absolute;left:0;right:0;top:0;height:3px;

    opacity:0;transition:opacity .3s;}
  .alert-strip.show{opacity:.8;animation:slide 2s linear infinite;}
  @keyframes slide{from{transform:translateX(-30%)}to{transform:translateX(30%)}}

  /* hide tweaks-related panel scaling helper variable */
  .twk-panel{--dc-inv-zoom:1;}

  /* ── §4-7 Map overlay ──────────────────────────────────── */
  .map-hint{position:absolute;left:calc(50% + 360px);bottom:42px;
    display:flex;align-items:center;gap:10px;
    padding:10px 16px;border:1px solid rgba(154,139,118,.3);
    background:rgba(20,12,8,.5);backdrop-filter:blur(2px);
    color:var(--ink-dim);font-family:'Share Tech Mono',monospace;font-size:11px;
    letter-spacing:.22em;text-transform:uppercase;cursor:pointer;

  .map-hint:hover{color:var(--ink);border-color:#b8975a;
    box-shadow:0 0 18px rgba(184,151,90,.25);}
  .map-hint .scroll-icn{color:#b8975a;display:inline-flex;}
  .map-hint .kbd{display:inline-block;padding:1px 7px;border:1px solid rgba(184,151,90,.5);
    border-radius:2px;font-size:10px;letter-spacing:.1em;color:#d8b87c;
    background:rgba(0,0,0,.35);}

  .map-overlay{position:absolute;inset:0;z-index:60;
    background:rgba(10,5,2,.88);
    display:grid;place-items:center;cursor:pointer;
    animation:mapfade .35s ease-out both;}
  @keyframes mapfade{from{opacity:0;backdrop-filter:blur(0)}
    to{opacity:1;backdrop-filter:blur(2px)}}

  .map-frame{position:relative;width:720px;height:780px;
    padding:32px 36px 28px;cursor:default;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(70,46,24,.35), transparent 60%),
      linear-gradient(180deg,#1f1408 0%, #120a04 100%);
    border:3px solid #5a4128;
    box-shadow:
      0 0 0 1px rgba(0,0,0,.7),
      0 0 0 8px #1a1108,
      0 0 0 9px #6a4e2e,
      0 40px 100px rgba(0,0,0,.8),
      0 0 80px rgba(180,140,80,.12) inset;
    animation:mappop .5s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes mappop{from{transform:translateY(20px) scale(.96);opacity:0}
    to{transform:none;opacity:1}}

  /* heavier gothic border lining */
  .map-frame::before{content:"";position:absolute;inset:10px;pointer-events:none;
    border:1px solid rgba(232,217,192,.18);
    background:
      radial-gradient(ellipse at 30% 14%, rgba(232,217,192,.04), transparent 50%),
      radial-gradient(ellipse at 70% 88%, rgba(0,0,0,.4), transparent 60%);}
  .map-frame::after{content:"";position:absolute;inset:18px;pointer-events:none;
    border:1px dashed rgba(184,151,90,.18);}

  .map-corner{position:absolute;width:64px;height:64px;color:#b8975a;
    opacity:.9;pointer-events:none;}
  .map-corner.tl{top:14px;left:14px;}
  .map-corner.tr{top:14px;right:14px;transform:scaleX(-1);}
  .map-corner.bl{bottom:14px;left:14px;transform:scaleY(-1);}
  .map-corner.br{bottom:14px;right:14px;transform:scale(-1,-1);}

  .map-title{position:relative;text-align:center;font-family:'Cinzel',serif;
    font-size:22px;letter-spacing:.32em;color:#d8b87c;text-transform:uppercase;
    margin-bottom:4px;text-shadow:0 0 14px rgba(184,151,90,.35);}
  .map-sub{position:relative;text-align:center;font-family:'IM Fell English',serif;
    font-style:italic;font-size:14px;color:var(--ink-dim);letter-spacing:.16em;
    margin-bottom:14px;}

  .map-svg{display:block;margin:0 auto;width:640px;height:580px;}

  .map-foot{position:relative;margin-top:8px;display:flex;align-items:center;
    justify-content:center;gap:14px;font-family:'Share Tech Mono',monospace;
    font-size:11px;letter-spacing:.22em;color:var(--ink-dim);text-transform:uppercase;}
  .map-foot .kbd{display:inline-block;padding:1px 7px;border:1px solid rgba(184,151,90,.5);
    border-radius:2px;color:#d8b87c;background:rgba(0,0,0,.35);font-size:10px;}
  .map-foot .legend{display:flex;gap:14px;}
  .map-foot .lg{display:flex;align-items:center;gap:5px;}
  .map-foot .lg .sw{width:9px;height:9px;border-radius:50%;display:inline-block;
    border:1px solid rgba(0,0,0,.6);}
</style>
</head>

<script>
  // 1920x1080 fit-scaling
  function fitStage(){
    const s = document.getElementById('stage');
    if(!s) return;
    const sx = window.innerWidth / 1920;
    const sy = window.innerHeight / 1080;
    const k = Math.min(sx, sy);
    s.style.transform = `scale(${k})`;
  }
  fitStage();
  window.addEventListener('resize', fitStage);
</script>
